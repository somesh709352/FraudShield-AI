services:
  # Backend API Service
  - type: web
    name: fraudshield-api
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: fraudshield-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://fraudshield-ai.vercel.app,http://localhost:3000"
      - key: DEBUG
        value: "false"

databases:
  - name: fraudshield-db
    plan: free
    region: oregon